name: Contract security regression

on:
  pull_request:
    paths:
      - "contracts/**"
      - "tests/test_front_run_regression.py"
      - "requirements.txt"
      - ".github/workflows/contract-tests.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "tests/test_front_run_regression.py"
      - "requirements.txt"
      - ".github/workflows/contract-tests.yml"

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run front-run and payout binding regression
        run: python -m pytest -q tests/test_front_run_regression.py
