name: Contract security regression

on:
  pull_request:
    paths:
      - "contracts/**"
      - "tests/test_front_run_regression.py"
      - "requirements.txt"
      - ".github/workflows/contract-tests.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "tests/test_front_run_regression.py"
      - "requirements.txt"
      - ".github/workflows/contract-tests.yml"

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run front-run and payout binding regression
        run: python -m pytest -q tests/test_front_run_regression.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Diagnose failed Studionet commit transaction
        run: |
          npm install --no-save genlayer-js@0.18.0
          node --input-type=module <<'NODE'
          import { createClient } from "genlayer-js";
          import { studionet } from "genlayer-js/chains";

          const hash = "0x9bf97a41710d72bfac6ebc5bfccd9b3d2f70f18a85cb82da00a1338689dd4615";
          const client = createClient({
            chain: studionet,
            endpoint: "https://studio.genlayer.com/api"
          });

          const tx = await client.getTransaction({ hash });
          console.log(JSON.stringify(tx, null, 2));
          NODE
