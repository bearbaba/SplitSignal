name: Contract security regression

on:
  pull_request:
    paths:
      - "contracts/**"
      - "tests/test_front_run_regression.py"
      - "requirements.txt"
      - ".github/workflows/contract-tests.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "tests/test_front_run_regression.py"
      - "requirements.txt"
      - ".github/workflows/contract-tests.yml"

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run front-run and payout binding regression
        run: python -m pytest -q tests/test_front_run_regression.py
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Diagnose failed Studionet recheck transaction
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://studio.genlayer.com/api";
          const hash = "0xcaaa2e4947d1a1bfbe046b3e44c7999025572415f17f339c288d564532084aa4";

          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              jsonrpc: "2.0",
              id: 1,
              method: "eth_getTransactionByHash",
              params: [hash]
            })
          });

          const data = await response.json();
          const tx = data.result || {};
          const receipts = tx.consensus_data?.leader_receipt || [];

          console.log(JSON.stringify({
            status: tx.status,
            result_name: tx.result_name,
            tx_execution_result: tx.tx_execution_result,
            tx_execution_result_name: tx.tx_execution_result_name,
            sender: tx.sender,
            recipient: tx.recipient,
            leader_receipts: receipts.map(r => ({
              mode: r.mode,
              vote: r.vote,
              execution_result: r.execution_result,
              result: r.result,
              error: r.error,
              genvm_result: r.genvm_result,
              stdout: r.genvm_result?.stdout,
              stderr: r.genvm_result?.stderr,
              raw_error: r.genvm_result?.raw_error,
              error_code: r.genvm_result?.error_code,
              error_description: r.genvm_result?.error_description
            }))
          }, null, 2));
          NODE

