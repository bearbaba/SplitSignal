<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SplitSignal</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#12110e; --card:#1d1b16; --line:rgba(244,236,220,.12); --muted:#b7b1a4; --ink:#f7f1e6; --hot:#e85d04; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Newsreader,serif; }
  main { max-width:1040px; margin:0 auto; padding:24px 20px 72px; }
  nav, .row, .tabs { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  nav { justify-content:space-between; }
  a, .mono, button { font-family:"IBM Plex Mono",monospace; }
  a, .mono { color:var(--muted); font-size:12px; text-decoration:none; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:8px 12px; }
  h1 { font-size:68px; font-weight:500; line-height:.88; margin:26px 0 8px; }
  h1 i { color:var(--hot); }
  .tabs { margin:20px 0; }
  .tabs button.on { background:var(--ink); color:#17140f; }
  .pane { display:none; }
  .pane.on { display:block; }
  .desk { display:grid; grid-template-columns:1.3fr .7fr; gap:12px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:18px; }
  .stage { min-height:220px; display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; }
  .side b { display:block; font-size:64px; margin:8px 0; }
  .mark { font-size:32px; color:var(--hot); }
  label { display:block; margin:12px 0 6px; color:var(--muted); font-size:11px; letter-spacing:.12em; }
  input { width:100%; border:0; border-bottom:1px solid var(--line); background:transparent; color:white; padding:10px 0; font:20px Newsreader,serif; }
  button { border:1px solid var(--line); background:transparent; color:white; border-radius:999px; padding:10px 14px; cursor:pointer; }
  .hot { background:var(--hot); border-color:var(--hot); } .fill { background:var(--ink); color:#17140f; }
  .pill { border-radius:999px; padding:4px 8px; background:#2c291f; }
  .OPEN { background:#243224; } .SPLIT { background:var(--hot); }
  pre { white-space:pre-wrap; font-size:12px; color:#ddd6c6; }
  @media (max-width:800px) { h1 { font-size:44px; } .desk, .stage { grid-template-columns:1fr; } .mark { display:none; } }
</style>
</head>
<body>
<main>
  <nav>
    <b>SplitSignal</b>
    <div class="row">
      <span class="chip mono">Studionet</span>
      <a class="chip" href="https://studio.genlayer.com/?import-contract=0x9643A50a9645A3CF90CDC188b44f71Ec07C141b6">0x9643…41b6</a>
      <button id="connect" class="fill">Connect</button>
    </div>
  </nav>
  <h1>Two pages.<br><i>One window.</i></h1>
  <p class="mono">Bond travels with the transaction. Before the deadline only recheck pays. After it, only refund.</p>
  <div class="tabs">
    <button class="on" data-tab="dash">Dashboard</button>
    <button data-tab="open">Open</button>
    <button data-tab="watch">Watch</button>
  </div>
  <section id="dash" class="pane on">
    <div class="desk">
      <div class="stage">
        <div class="side"><span class="mono">LEFT</span><b id="leftVal">—</b><span class="mono" id="leftUrl"></span></div>
        <div class="mark" id="mark">=</div>
        <div class="side"><span class="mono">RIGHT</span><b id="rightVal">—</b><span class="mono" id="rightUrl"></span></div>
      </div>
      <div>
        <div class="row" style="justify-content:space-between"><b id="title">No watch yet</b><span class="pill" id="pill">—</span></div>
        <p class="mono" id="meta">Next id is 1. This book is empty.</p>
        <button id="dashRead" class="fill">Load book</button>
      </div>
    </div>
  </section>
  <section id="open" class="pane">
    <label>LEFT</label><input id="left" value="https://www.iana.org/domains/reserved" />
    <label>RIGHT</label><input id="right" value="https://www.iana.org/domains" />
    <label>FIELD</label><input id="field" value="iana" />
    <div class="row">
      <div style="flex:1"><label>BOND GEN</label><input id="bond" value="0.1" /></div>
      <div style="flex:1"><label>HOURS</label><input id="hours" value="1" /></div>
    </div>
    <div class="row" style="margin-top:16px"><button id="openWatch" class="hot">Lock window</button></div>
  </section>
  <section id="watch" class="pane">
    <label>WATCH ID</label><input id="id" value="1" />
    <div class="row" style="margin-top:16px"><button id="read" class="fill">Read</button><button id="recheck" class="hot">Recheck</button><button id="refund">Refund</button></div>
  </section>
  <details id="log"><summary class="mono">Receipt</summary><pre id="out">Connect a Studionet wallet.</pre></details>
</main>
<script type="module">
import { createClient } from "https://esm.sh/genlayer-js@0.18.0?bundle";
import { studionet } from "https://esm.sh/genlayer-js@0.18.0/chains?bundle";
const CONTRACT = "0x9643A50a9645A3CF90CDC188b44f71Ec07C141b6";
const ZERO = "0x0000000000000000000000000000000000000000";
const out = document.querySelector("#out");
let account = null, provider = null;
const gen = (v) => (Number(v) / 1e18).toFixed(2) + " GEN";
function show(v) { const text = typeof v === "string" ? v : JSON.stringify(v, null, 2); out.textContent = text; document.querySelector("#log").open = text.startsWith("REJECTED"); }
function readClient() { return createClient({ chain: studionet, endpoint: "https://studio.genlayer.com/api", account: account || ZERO }); }
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.remove("on"));
  document.querySelectorAll(".pane").forEach((x) => x.classList.remove("on"));
  b.classList.add("on");
  document.getElementById(b.dataset.tab).classList.add("on");
});
async function write(functionName, args, value = 0n) {
  if (!account) throw new Error("REJECTED: connect first");
  show("SUBMITTING " + functionName);
  const c = createClient({ chain: studionet, account, provider });
  await c.connect("studionet");
  const tx = await c.writeContract({ address: CONTRACT, functionName, args, value });
  show("SUBMITTED " + functionName + "\n" + (typeof tx === "string" ? tx : JSON.stringify(tx, null, 2)));
  return tx;
}
async function watch(id) {
  const raw = await readClient().readContract({ address: CONTRACT, functionName: "get_watch", args: [String(id)], stateStatus: "accepted" });
  return typeof raw === "string" ? JSON.parse(raw) : raw;
}
function paint(rec) {
  if (!rec || !rec.id) return;
  document.querySelector("#title").textContent = "Watch " + rec.id;
  document.querySelector("#pill").textContent = rec.status || "—";
  document.querySelector("#pill").className = "pill " + (rec.status || "");
  document.querySelector("#leftVal").textContent = rec.left_value || "—";
  document.querySelector("#rightVal").textContent = rec.right_value || "—";
  document.querySelector("#leftUrl").textContent = rec.left_url || "";
  document.querySelector("#rightUrl").textContent = rec.right_url || "";
  document.querySelector("#mark").textContent = rec.left_value && rec.right_value && rec.left_value !== rec.right_value ? "!=" : "=";
  const end = rec.deadline ? new Date(rec.deadline * 1000).toLocaleString() : "—";
  document.querySelector("#meta").textContent = (rec.field || "—") + " · " + (rec.amount ? gen(rec.amount) : "—") + " · until " + end + " · " + (rec.note || "");
}
async function board() {
  const raw = await readClient().readContract({ address: CONTRACT, functionName: "next_watch", args: [], stateStatus: "accepted" });
  const next = Number(raw);
  const rows = [];
  for (let i = 1; i < next; i++) rows.push(await watch(String(i)));
  if (rows[0]) paint(rows[0]);
  show(rows.length ? rows : "No watch yet. Next id " + next);
}
document.querySelector("#connect").onclick = async () => {
  try {
    provider = window.ethereum;
    if (!provider) return show("REJECTED: no wallet");
    account = (await provider.request({ method: "eth_requestAccounts" }))[0];
    document.querySelector("#connect").textContent = account.slice(0, 6) + "…" + account.slice(-4);
    show("CONNECTED " + account);
    await board();
  } catch (e) { show("REJECTED: " + (e.message || String(e))); }
};
document.querySelector("#openWatch").onclick = async () => {
  try {
    const value = BigInt(Math.round(Number(document.querySelector("#bond").value) * 1e6)) * 10n ** 12n;
    await write("open_watch", [document.querySelector("#left").value.trim(), document.querySelector("#right").value.trim(), document.querySelector("#field").value.trim(), document.querySelector("#hours").value.trim()], value);
  } catch (e) { show("REJECTED: " + (e.message || String(e))); }
};
document.querySelector("#read").onclick = () => watch(document.querySelector("#id").value).then((rec) => { paint(rec); show(rec); }).catch((e) => show("REJECTED: " + (e.message || String(e))));
document.querySelector("#dashRead").onclick = () => board().catch((e) => show("REJECTED: " + (e.message || String(e))));
document.querySelector("#recheck").onclick = async () => { try { await write("recheck", [document.querySelector("#id").value]); } catch (e) { show("REJECTED: " + (e.message || String(e))); } };
document.querySelector("#refund").onclick = async () => { try { await write("refund", [document.querySelector("#id").value]); } catch (e) { show("REJECTED: " + (e.message || String(e))); } };
</script>
</body>
</html>
