<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SplitSignal</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#f3efe6; --ink:#1b1914; --muted:#6f6a60; --line:#e2d9cc; --hot:#d84a1b; --card:#fffdf8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Newsreader",serif; }
  main { max-width:1080px; margin:0 auto; padding:28px 22px 80px; }
  nav, .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  nav { justify-content:space-between; }
  .mono, a { font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); text-decoration:none; }
  h1 { font-size:76px; line-height:.88; font-weight:500; margin:36px 0 12px; letter-spacing:-.035em; }
  h1 i { color:var(--hot); font-style:italic; }
  .lead { max-width:560px; font-size:22px; line-height:1.35; margin:0 0 28px; }
  .nums { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--ink); border-bottom:1px solid var(--ink); }
  .nums div { padding:16px 0; }
  .nums b { display:block; font-size:34px; margin-top:4px; }
  .desk { display:grid; grid-template-columns:1fr 1fr; gap:42px; margin-top:28px; }
  label { display:block; margin:16px 0 6px; font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em; color:var(--muted); }
  input { width:100%; border:0; border-bottom:1px solid var(--line); background:transparent; color:var(--ink); padding:10px 0; font:18px "Newsreader",serif; }
  button { font-family:"IBM Plex Mono",monospace; font-size:12px; border:1px solid var(--ink); background:transparent; border-radius:999px; padding:10px 14px; cursor:pointer; }
  .hot { background:var(--hot); color:white; border-color:var(--hot); }
  .fill { background:var(--ink); color:var(--bg); }
  .split { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:end; margin:22px 0; }
  .src b { display:block; font-size:48px; line-height:1; margin:8px 0; }
  .eq { font-size:28px; color:var(--hot); }
  pre { margin-top:28px; white-space:pre-wrap; font-family:"IBM Plex Mono",monospace; font-size:12px; color:#3d3a34; }
  @media (max-width:800px) { h1 { font-size:48px; } .desk, .nums, .split { grid-template-columns:1fr; } .eq { display:none; } }
</style>
</head>
<body>
<main>
  <nav>
    <b>SplitSignal</b>
    <div class="row">
      <span class="mono">Studionet</span>
      <a href="https://studio.genlayer.com/?import-contract=0x07aeE113dD0248DB23BC0259ba1197D0cFC9e15b">0x07ae…e15b</a>
      <button id="connect" class="fill">Connect</button>
    </div>
  </nav>
  <h1>Two pages.<br><i>One window.</i></h1>
  <p class="lead">Money sits in the pool. A window locks only when both pages agree. The account that catches the split is paid.</p>
  <div class="nums">
    <div><span class="mono">POOL</span><b id="poolVal">—</b></div>
    <div><span class="mono">RESERVED</span><b id="reservedVal">—</b></div>
    <div><span class="mono">FREE</span><b id="freeVal">—</b></div>
  </div>
  <div class="desk">
    <section>
      <label>DEPOSIT GEN</label><input id="dep" value="1" />
      <div class="row" style="margin-top:14px"><button id="deposit" class="fill">Deposit</button><button id="withdraw">Withdraw</button><button id="refresh">Refresh</button></div>
      <label>LEFT</label><input id="left" value="https://example.org" />
      <label>RIGHT</label><input id="right" value="https://www.iana.org" />
      <label>FIELD</label><input id="field" value="iana" />
      <div class="row">
        <div style="flex:1"><label>BOND</label><input id="bond" value="1" /></div>
        <div style="flex:1"><label>HOURS</label><input id="hours" value="24" /></div>
      </div>
      <div class="row" style="margin-top:18px"><button id="openWatch" class="hot">Lock window</button></div>
    </section>
    <section>
      <span class="mono">WATCH</span>
      <h2 id="title" style="font-size:42px;margin:6px 0">Nothing open</h2>
      <span class="mono" id="pill">—</span>
      <label>WATCH ID</label><input id="id" value="1" />
      <div class="split">
        <div class="src"><span class="mono">LEFT</span><b id="leftVal">—</b><span class="mono" id="leftUrl"></span></div>
        <div class="eq" id="mark">=</div>
        <div class="src"><span class="mono">RIGHT</span><b id="rightVal">—</b><span class="mono" id="rightUrl"></span></div>
      </div>
      <p class="mono" id="meta">Read a watch after it finalizes.</p>
      <div class="row"><button id="read" class="fill">Read</button><button id="recheck" class="hot">Recheck</button><button id="refund">Refund</button></div>
    </section>
  </div>
  <pre id="out">Connect a Studionet wallet.</pre>
</main>
<script type="module">
import { createClient } from "https://esm.sh/genlayer-js@0.18.0?bundle";
import { studionet } from "https://esm.sh/genlayer-js@0.18.0/chains?bundle";
const CONTRACT = "0x07aeE113dD0248DB23BC0259ba1197D0cFC9e15b";
const ZERO = "0x0000000000000000000000000000000000000000";
const out = document.querySelector("#out");
let account = null, provider = null;
const gen = (v) => (Number(v) / 1e18).toFixed(2) + " GEN";
function show(v) { out.textContent = typeof v === "string" ? v : JSON.stringify(v, null, 2); }
function readClient() { return createClient({ chain: studionet, endpoint: "https://studio.genlayer.com/api", account: account || ZERO }); }
async function write(functionName, args, value = 0n) {
  if (!account) throw new Error("Connect first.");
  const c = createClient({ chain: studionet, account, provider });
  await c.connect("studionet");
  return c.writeContract({ address: CONTRACT, functionName, args, value });
}
async function pool() {
  const raw = await readClient().readContract({ address: CONTRACT, functionName: "get_pool", args: [], stateStatus: "accepted" });
  const data = typeof raw === "string" ? JSON.parse(raw) : raw;
  document.querySelector("#poolVal").textContent = gen(data.pool);
  document.querySelector("#reservedVal").textContent = gen(data.reserved);
  document.querySelector("#freeVal").textContent = gen(data.free);
  return data;
}
async function watch(id) {
  const raw = await readClient().readContract({ address: CONTRACT, functionName: "get_watch", args: [String(id)], stateStatus: "accepted" });
  return typeof raw === "string" ? JSON.parse(raw) : raw;
}
function paint(rec) {
  document.querySelector("#title").textContent = rec.id ? "Watch " + rec.id : "Watch";
  document.querySelector("#pill").textContent = rec.status || "—";
  document.querySelector("#leftVal").textContent = rec.left_value || "—";
  document.querySelector("#rightVal").textContent = rec.right_value || "—";
  document.querySelector("#leftUrl").textContent = rec.left_url || "";
  document.querySelector("#rightUrl").textContent = rec.right_url || "";
  document.querySelector("#mark").textContent = rec.left_value && rec.right_value && rec.left_value !== rec.right_value ? "≠" : "=";
  const end = rec.deadline ? new Date(rec.deadline * 1000).toLocaleString() : "—";
  document.querySelector("#meta").textContent = (rec.field || "—") + " · " + (rec.amount ? gen(rec.amount) : "—") + " · until " + end + " · " + (rec.note || "");
}
document.querySelector("#connect").onclick = async () => {
  provider = window.ethereum;
  if (!provider) return show("No wallet.");
  account = (await provider.request({ method: "eth_requestAccounts" }))[0];
  show(await pool().catch((e) => e.message || String(e)));
};
document.querySelector("#refresh").onclick = () => pool().then(show).catch((e) => show(e.message || String(e)));
document.querySelector("#deposit").onclick = async () => { try { show(await write("deposit", [], BigInt(document.querySelector("#dep").value) * 10n ** 18n)); } catch (e) { show(e.message || String(e)); } };
document.querySelector("#withdraw").onclick = async () => { try { show(await write("withdraw", [(BigInt(document.querySelector("#dep").value) * 10n ** 18n).toString()])); } catch (e) { show(e.message || String(e)); } };
document.querySelector("#openWatch").onclick = async () => {
  try {
    const amount = (BigInt(document.querySelector("#bond").value) * 10n ** 18n).toString();
    show(await write("open_watch", [document.querySelector("#left").value.trim(), document.querySelector("#right").value.trim(), document.querySelector("#field").value.trim(), document.querySelector("#hours").value.trim(), amount]));
  } catch (e) { show(e.message || String(e)); }
};
document.querySelector("#read").onclick = () => watch(document.querySelector("#id").value).then((rec) => { paint(rec); show(rec); }).catch((e) => show(e.message || String(e)));
document.querySelector("#recheck").onclick = async () => { try { show(await write("recheck", [document.querySelector("#id").value])); } catch (e) { show(e.message || String(e)); } };
document.querySelector("#refund").onclick = async () => { try { show(await write("refund", [document.querySelector("#id").value])); } catch (e) { show(e.message || String(e)); } };
</script>
</body>
</html>
